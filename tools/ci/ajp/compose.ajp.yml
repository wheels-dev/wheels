# Regression check: TestClient works behind an AJP front end (#4210). Layered on compose.yml:
#   docker compose -p <project> -f compose.yml -f tools/ci/ajp/compose.ajp.yml up -d lucee7 httpd
# Lucee 7 gets an AJP connector on 8009; httpd (mod_proxy_ajp) fronts it on port 80 inside
# the SAME network namespace, the way IIS+BonCode or mod_jk sit on the app server. Every hop
# is loopback, so the test-context gate (loopback peers only) binds as it does there.
# tools/ci/ajp/run.sh generates both config files and sets the variables below.
services:
  lucee7:
    # Only the front end is published; Lucee's own HTTP port stays inside the container.
    ports: !override
      - "${AJP_HTTPD_PORT:-9590}:80"
    volumes:
      - type: bind
        source: ${AJP_SERVER_JSON:?run through tools/ci/ajp/run.sh, which generates it}
        target: /wheels-test-suite/server.json
  httpd:
    image: ${AJP_HTTPD_IMAGE:-httpd:2.4}
    network_mode: "service:lucee7"
    volumes:
      - type: bind
        source: ${AJP_HTTPD_CONF:?run through tools/ci/ajp/run.sh, which generates it}
        target: /usr/local/apache2/conf/httpd.conf
        read_only: true
    depends_on:
      - lucee7
