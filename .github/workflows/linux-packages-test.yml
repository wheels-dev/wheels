name: Linux packages

# Tests the /usr/bin/wheels wrapper that the .deb/.rpm packages ship
# (generated by tools/distribution-drafts/linux-packages/build-linux-packages.sh).
# The wrapper must run LuCLI on a Java 21+ runtime even when JAVA_HOME points at
# an older JDK, which is the default on GitHub's Ubuntu runners (JAVA_HOME = Java 17,
# with Java 21 installed alongside), so the real-environment leg below reproduces
# exactly that case.

on:
  pull_request:
    paths:
      - 'tools/distribution-drafts/linux-packages/**'
      - '.github/workflows/linux-packages-test.yml'
  push:
    branches: [develop, main]
    paths:
      - 'tools/distribution-drafts/linux-packages/**'
      - '.github/workflows/linux-packages-test.yml'

permissions:
  contents: read

jobs:
  wrapper-java:
    name: "Wrapper selects Java 21+"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show the runner's Java
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          ls -d /usr/lib/jvm/* 2>/dev/null || true

      - name: Test the wrapper's Java selection (fake JDKs, then the runner's real JAVA_HOME)
        run: bash tools/distribution-drafts/linux-packages/test-wrapper-java.sh --real
