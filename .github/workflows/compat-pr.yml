# PR compatibility gate: runs the full core test suite on the engines that
# most often diverge from Lucee — BoxLang and Adobe 2023 — on the cheapest
# database (SQLite, no external container).
#
# This is the subset of compat-matrix.yml that catches the class of bug the
# nightly matrix exists for (cross-engine regressions), at PR time instead of
# at release preflight. The full engine x database matrix stays nightly +
# manual (compat-matrix.yml); SQLite is sufficient to catch engine-specific
# breakage, which is independent of the database.
#
# One database-specific leg rides along: Lucee 7 + H2. H2 is embedded (no
# external container) and its SQL dialect diverges enough to break on its own:
# an H2-only query-builder regression (#3684) went unseen until the weekly
# matrix. The two sqlite legs keep their check names, which branch protection
# requires; the H2 leg is not required unless maintainers add it.
#
# The workflow triggers on EVERY PR (no path filter) and reports a success
# no-op when the PR doesn't touch framework/CLI code. This is required
# because the two legs are registered as required branch-protection checks,
# and a path-gated required check blocks merges whenever the workflow skips
# (the failure mode documented in rustcfml-ci.yml). Gating the heavy Docker
# steps on a framework-changed flag keeps the check green for docs/web PRs
# without paying for image builds.

name: Wheels PR Compat Gate

on:
  pull_request:
    branches: [develop]

concurrency:
  group: compat-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compat:
    name: "${{ matrix.cfengine }} + ${{ matrix.database }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cfengine: [boxlang, adobe2023]
        database: [sqlite]
        include:
          - cfengine: lucee7
            database: h2
    env:
      PORT_boxlang: 60001
      PORT_adobe2023: 62023
      PORT_lucee7: 60007
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect framework changes
        id: changes
        env:
          # Diff against the PR's base commit, which the full-history checkout
          # already holds. Re-fetching the base branch with --depth=1 grafted
          # its tip as a shallow root, so once develop moved past the merge ref
          # `origin/develop...HEAD` had no merge base; git diff then exited 128
          # and every such PR ran the full compat suites, docs-only or not.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          fi
          # A failed diff (exit > 1) falls through to framework_changed=true.
          if git diff --quiet "${BASE_SHA}...HEAD" -- \
              vendor/wheels cli/lucli .github/workflows/compat-pr.yml; then
            echo "framework_changed=false" >> "$GITHUB_OUTPUT"
            echo "No framework/CLI changes — skipping the compat suites (no-op success)."
          else
            echo "framework_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ojdbc10 for Adobe engines
        if: steps.changes.outputs.framework_changed == 'true' && matrix.cfengine == 'adobe2023'
        run: |
          mkdir -p ./.engine/adobe2023/WEB-INF/lib
          wget -q https://download.oracle.com/otn-pub/otn_software/jdbc/1927/ojdbc10.jar \
            -O ./.engine/adobe2023/WEB-INF/lib/ojdbc10.jar

      - name: Start CF engine
        if: steps.changes.outputs.framework_changed == 'true'
        env:
          CFENGINE: ${{ matrix.cfengine }}
        run: |
          set -e
          MAX_ATTEMPTS=3
          ATTEMPT=1
          until docker compose build --no-cache "$CFENGINE"; do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "::error::docker compose build failed after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            echo "::warning::Build attempt ${ATTEMPT} failed — sleeping 30s before retry"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done
          docker compose up -d "$CFENGINE"

      - name: Wait for CF engine to be ready
        if: steps.changes.outputs.framework_changed == 'true'
        env:
          CFENGINE: ${{ matrix.cfengine }}
        run: |
          PORT_VAR="PORT_${CFENGINE}"
          PORT="${!PORT_VAR}"
          CONTAINER="wheels-${CFENGINE}-1"
          echo "Waiting for ${CFENGINE} on port ${PORT}..."

          # Ceiling: Adobe 2023 answered on attempt 42-57 of the old 60 across
          # four compat-matrix runs (2026-09-27); BoxLang on 7-12. 120 leaves ~2x
          # the observed worst case; a dead engine fails after ~10-20 min, inside
          # this job's 45-minute timeout. See compat-matrix.yml for the details.
          MAX_WAIT=120
          WAIT_COUNT=0
          RESTARTS=0
          MAX_RESTARTS=3
          LAST_HTTP_CODE="000"
          # Track readiness explicitly: success on the final attempt leaves
          # WAIT_COUNT == MAX_WAIT, so the count alone can't tell success from
          # exhaustion (#3685).
          READY=false
          while [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; do
            WAIT_COUNT=$((WAIT_COUNT + 1))

            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "missing")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ] || [ "$CONTAINER_STATUS" = "missing" ]; then
              RESTARTS=$((RESTARTS + 1))
              if [ "$RESTARTS" -le "$MAX_RESTARTS" ]; then
                echo "Container $CONTAINER has status '$CONTAINER_STATUS' — restarting (attempt $RESTARTS/$MAX_RESTARTS)..."
                docker compose up -d "${CFENGINE}"
                sleep 10
                continue
              else
                echo "::error::Container $CONTAINER failed to start after $MAX_RESTARTS restart attempts"
                docker logs "$CONTAINER" 2>&1 | tail -100
                exit 1
              fi
            fi

            LAST_HTTP_CODE=$(curl -s -o /dev/null --connect-timeout 2 --max-time 5 -w "%{http_code}" "http://localhost:${PORT}/" 2>/dev/null || true)
            LAST_HTTP_CODE=${LAST_HTTP_CODE:-000}
            if echo "$LAST_HTTP_CODE" | grep -qE "^(200|302|404)$"; then
              echo "CF engine is ready! (HTTP $LAST_HTTP_CODE on attempt $WAIT_COUNT/$MAX_WAIT)"
              if [ $((WAIT_COUNT * 4)) -gt $((MAX_WAIT * 3)) ]; then
                echo "::warning::${CFENGINE} became ready at attempt $WAIT_COUNT/$MAX_WAIT (past 3/4 of the ceiling); readiness headroom is shrinking."
              fi
              READY=true
              break
            fi

            if [ $((WAIT_COUNT % 10)) -eq 0 ]; then
              echo "  attempt $WAIT_COUNT/$MAX_WAIT: container=$CONTAINER_STATUS, http=$LAST_HTTP_CODE"
            fi

            if [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; then
              sleep 5
            fi
          done

          if [ "$READY" != "true" ]; then
            echo "::error::CF engine not ready after ${MAX_WAIT} attempts (last HTTP code: $LAST_HTTP_CODE)"
            echo "=== Container logs (raw, last 200 lines) ==="
            docker logs "$CONTAINER" 2>&1 | tail -200
            exit 1
          fi

      - name: Install CFPM packages
        if: steps.changes.outputs.framework_changed == 'true' && matrix.cfengine == 'adobe2023'
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES: Installing CFPM packages..."
            if docker exec wheels-adobe2023-1 box cfpm install image,mail,zip,debugger,caching,mysql,postgresql,sqlserver,oracle; then
              echo "CFPM packages installed successfully"
              exit 0
            fi
            echo "CFPM installation failed on attempt $RETRY_COUNT"
            if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
              docker exec wheels-adobe2023-1 box server restart || true
              sleep 10
            fi
          done
          echo "Failed to install CFPM packages after $MAX_RETRIES attempts"
          exit 1

      - name: Run test suite for ${{ matrix.database }}
        if: steps.changes.outputs.framework_changed == 'true'
        env:
          DB: ${{ matrix.database }}
        run: |
          PORT_VAR="PORT_${{ matrix.cfengine }}"
          PORT="${!PORT_VAR}"
          BASE_URL="http://localhost:${PORT}/wheels/core/tests"
          RESULT_FILE="/tmp/${{ matrix.cfengine }}-${DB}-result.txt"

          echo "Warming up Wheels application before first test run..."
          curl -s -o /dev/null --max-time 60 "http://localhost:${PORT}/" || true
          sleep 2

          TEST_URL="${BASE_URL}?db=${DB}&format=json"

          MAX_RETRIES=3
          RETRY_COUNT=0
          HTTP_CODE="000"
          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Test attempt ${RETRY_COUNT} of ${MAX_RETRIES}..."
            HTTP_CODE=$(curl -s -o "$RESULT_FILE" \
              --max-time 900 \
              --write-out "%{http_code}" \
              "$TEST_URL" || echo "000")
            echo "HTTP Code: ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "417" ]; then
              break
            fi
            if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "Transient error (HTTP ${HTTP_CODE}), waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          MIN_SPECS=4000
          TOTAL_SPECS="-1"
          FAIL_COUNT="-1"
          if [ -f "$RESULT_FILE" ] && { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "417" ]; }; then
            read -r FAIL_COUNT TOTAL_SPECS <<< "$(python3 -c "
          import json, sys
          try:
            d = json.load(open('$RESULT_FILE'))
            print(int(d.get('totalFail', 0) + d.get('totalError', 0)), int(d.get('totalSpecs', 0)))
          except:
            print(-1, -1)
          " 2>/dev/null || echo "-1 -1")"
          fi

          echo "${{ matrix.cfengine }} + ${DB}: ${FAIL_COUNT} failures, ${TOTAL_SPECS} specs"

          if [ "$HTTP_CODE" = "200" ] && [ "$FAIL_COUNT" = "0" ] && [ "$TOTAL_SPECS" -ge "$MIN_SPECS" ]; then
            echo "PASSED: ${{ matrix.cfengine }} + ${DB} (${TOTAL_SPECS} testcases)"
          else
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::${{ matrix.cfengine }} + ${DB}: HTTP ${HTTP_CODE} (expected 200)"
            elif [ "$FAIL_COUNT" != "0" ]; then
              echo "::error::${{ matrix.cfengine }} + ${DB}: ${FAIL_COUNT} failures/errors"
            else
              echo "::error::${{ matrix.cfengine }} + ${DB}: only ${TOTAL_SPECS} testcases (floor ${MIN_SPECS}) — suite likely compile-wiped"
            fi
            if [ -f "$RESULT_FILE" ]; then
              echo "=== Result head (first 2000 bytes) ==="
              head -c 2000 "$RESULT_FILE"
              echo
            fi
            echo "=== Container logs (last 100 lines) ==="
            docker logs "wheels-${{ matrix.cfengine }}-1" 2>&1 | tail -100
            exit 1
          fi

      - name: Report container exit state
        # A cgroup OOM-kill ends the JVM with exit 137 and NO Java error; name it.
        if: always() && steps.changes.outputs.framework_changed == 'true'
        env:
          CFENGINE: ${{ matrix.cfengine }}
          DB: ${{ matrix.database }}
        run: |
          BAD=0
          for C in "wheels-${CFENGINE}-1" "wheels-${DB}-1"; do
            STATE=$(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}} restarts={{.RestartCount}}' "$C" 2>/dev/null || echo "missing")
            # OOMKilled only reflects PID 1 (the CommandBox launcher); the server
            # JVM is its child, so a kernel kill of the JVM can leave the container
            # "running, oomkilled=false". The cgroup's oom_kill counter sees it.
            KILLS=$(docker exec "$C" sh -c 'cat /sys/fs/cgroup/memory.events 2>/dev/null || cat /sys/fs/cgroup/memory/memory.oom_control 2>/dev/null' 2>/dev/null | awk '$1=="oom_kill"{print $2}')
            STATE="$STATE cgroup_oom_kill=${KILLS:-n/a}"
            echo "$C: $STATE"
            case "$STATE" in
              missing*) ;;  # sqlite/h2 legs have no database container
              *oomkilled=true*|*cgroup_oom_kill=[1-9]*) echo "::error::$C had a process OOM-killed by the kernel (cgroup memory limit): $STATE"; BAD=1 ;;
              exited*|dead*) echo "::error::$C is not running after the suite: $STATE"; BAD=1 ;;
            esac
          done
          exit "$BAD"
