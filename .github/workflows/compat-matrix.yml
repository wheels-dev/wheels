# Compatibility matrix: runs all engines x databases (plus the RustCFML lane)
# on a nightly schedule, on manual dispatch (optionally narrowed with the
# `engines` / `databases` inputs), and on every release PR into `main`.
# Every leg gates the run's result, Oracle included (#3738): SOFT_FAIL_DBS is
# empty, and a leg with no result or fewer than MIN_SPECS testcases fails.
# The "Compatibility Matrix Gate" job rolls all legs into one check. On release
# PRs it requires the full, unnarrowed matrix to pass, and it is meant to be a
# required status check on the `main` ruleset (.github/RELEASE_PLAYBOOK.md,
# "Release readiness"). PRs into `develop` do not run this workflow.
#
# Each engine x database combination is its own matrix job, so the ~30 legs
# run in PARALLEL instead of sequentially inside one job per engine. Wall
# time for a full cycle dropped from ~17 minutes (slowest engine iterating
# every database in one job, restarting the engine container between legs)
# to a single leg's duration (~3-5 minutes). Leg isolation is also cleaner:
# each job gets a fresh engine container + only its own database, so no
# cross-database state can leak and the per-leg docker restart dance is gone.
name: Wheels Compatibility Matrix

on:
  # Release gate: a release is cut by a PR into `main` (release/X.Y.Z-to-main),
  # so running here puts every engine x database leg on the exact tree being
  # released. Day-to-day PRs target `develop` and are not affected. See
  # .github/RELEASE_PLAYBOOK.md ("Release readiness").
  pull_request:
    branches: [main]
  schedule:
    # Nightly: 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Open/update/close the tracking issue as a scheduled run would (to test notify-on-failure)'
        type: boolean
        default: false
      engines:
        description: 'Comma list of engines to run (blank = all: lucee6,lucee7,adobe2023,adobe2025,boxlang; add rustcfml to include that lane in a narrowed run)'
        type: string
        default: ''
      databases:
        description: 'Comma list of databases to run (blank = all: mysql,postgres,sqlserver,h2,cockroachdb,oracle,sqlite)'
        type: string
        default: ''

# A new push to a release PR supersedes the previous matrix for that PR, so
# cancel it. Scheduled and dispatched runs get a per-run group (run_id) and
# are never cancelled or queued behind each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Databases whose legs may report spec FAILURES without failing the run.
  # Empty: every database gates (#3738 made Oracle a hard leg). The mechanism
  # stays so a new database can be phased in, but it only ever covers counted
  # spec failures from a complete run. A leg with no result, an error
  # envelope, or fewer than MIN_SPECS testcases fails regardless.
  SOFT_FAIL_DBS: ""
  # Zero-test guard (#3302): a compile-wiped leg returns HTTP 200 with
  # totalSpecs=0, which used to render as a pass. Every leg runs the same core
  # suite (~5,800 specs), so anything below the floor means it never ran.
  MIN_SPECS: 4000

jobs:
  # Build the leg list. Scheduled runs and a plain dispatch cover the full
  # matrix; the `engines` / `databases` dispatch inputs narrow it for quick
  # iteration on one engine or database.
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_legs: ${{ steps.plan.outputs.has_legs }}
      rustcfml: ${{ steps.plan.outputs.rustcfml }}
    steps:
      - name: Compute legs
        id: plan
        env:
          ENGINES_INPUT: ${{ inputs.engines }}
          DATABASES_INPUT: ${{ inputs.databases }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          ENGINES = ["lucee6", "lucee7", "adobe2023", "adobe2025", "boxlang"]
          DATABASES = ["mysql", "postgres", "sqlserver", "h2", "cockroachdb", "oracle", "sqlite"]
          LUCEE_ONLY = {"h2"}

          def pick(raw, allowed, extra=()):
              items = [x.strip().lower() for x in (raw or "").split(",") if x.strip()]
              if not items:
                  return list(allowed), True
              bad = [x for x in items if x not in allowed and x not in extra]
              if bad:
                  print(f"::error::Unknown value(s) {bad}; valid: {list(allowed) + list(extra)}")
                  sys.exit(1)
              return items, False

          engines, all_engines = pick(os.environ.get("ENGINES_INPUT"), ENGINES, extra=("rustcfml",))
          databases, all_databases = pick(os.environ.get("DATABASES_INPUT"), DATABASES)
          run_rustcfml = (all_engines and all_databases) or "rustcfml" in engines
          engines = [e for e in engines if e != "rustcfml"]

          include = [
              {"cfengine": e, "database": d}
              for e in ENGINES if e in engines
              for d in DATABASES if d in databases
              if not (d in LUCEE_ONLY and not e.startswith("lucee"))
          ]
          if not include and not run_rustcfml:
              print("::error::The engines/databases inputs select no legs")
              sys.exit(1)
          print(f"{len(include)} leg(s): " + ", ".join(f"{l['cfengine']}+{l['database']}" for l in include))
          print(f"rustcfml lane: {run_rustcfml}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              # An empty include list is not a valid matrix; the tests job
              # is skipped in that case (rustcfml-only dispatch).
              out.write("matrix=" + json.dumps({"include": include}) + "\n")
              out.write("has_legs=" + ("true" if include else "false") + "\n")
              out.write("rustcfml=" + ("true" if run_rustcfml else "false") + "\n")
          PY

  tests:
    name: "${{ matrix.cfengine }} + ${{ matrix.database }}"
    needs: plan
    if: needs.plan.outputs.has_legs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PORT_lucee6: 60006
      PORT_lucee7: 60007
      PORT_adobe2023: 62023
      PORT_adobe2025: 62025
      PORT_boxlang: 60001
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download ojdbc10 for Adobe engines
        if: startsWith(matrix.cfengine, 'adobe')
        run: |
          mkdir -p ./.engine/${{ matrix.cfengine }}/WEB-INF/lib
          wget -q https://download.oracle.com/otn-pub/otn_software/jdbc/1927/ojdbc10.jar \
            -O ./.engine/${{ matrix.cfengine }}/WEB-INF/lib/ojdbc10.jar

      - name: Start CF engine
        # Retry the build to absorb transient external download failures
        # (GitHub Releases 503/504s for Adoptium JDK/JRE and similar). The
        # build itself is idempotent; only `up -d` runs after success.
        env:
          CFENGINE: ${{ matrix.cfengine }}
        run: |
          set -e
          MAX_ATTEMPTS=3
          ATTEMPT=1
          until docker compose build --no-cache "$CFENGINE"; do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "::error::docker compose build failed after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            echo "::warning::Build attempt ${ATTEMPT} failed — sleeping 30s before retry"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done
          docker compose up -d "$CFENGINE"

      - name: Start database container
        run: |
          DB="${{ matrix.database }}"
          case "$DB" in
            mysql|postgres|sqlserver|oracle)
              echo "Starting ${DB}..."
              docker compose up -d "${DB}"
              ;;
            cockroachdb)
              # The init sidecar creates the test database/user once the
              # main node is healthy (depends_on: service_healthy).
              echo "Starting cockroachdb + init sidecar..."
              docker compose up -d cockroachdb cockroachdb-init
              ;;
            h2|sqlite)
              echo "$DB requires no external container"
              ;;
          esac

      - name: Wait for CF engine to be ready
        env:
          CFENGINE: ${{ matrix.cfengine }}
        run: |
          PORT_VAR="PORT_${CFENGINE}"
          PORT="${!PORT_VAR}"
          CONTAINER="wheels-${CFENGINE}-1"

          echo "Waiting for ${CFENGINE} on port ${PORT}..."

          # Wait for HTTP response, restarting container if it crashes.
          # Tracks the last HTTP status code so timeout diagnostics can
          # distinguish "no response" (engine didn't bind) from "5xx"
          # (engine bound but app returning errors — e.g. issue #2646).
          #
          # Ceiling: measured over four matrix runs (2026-09-27), the Adobe
          # engines answered on attempt 42-57 (2023) and 48-60 (2025) of the old
          # 60; Lucee and BoxLang on 1-12. 120 leaves ~2x the observed worst
          # case. Each attempt is ~5-10s, so a dead engine now fails after
          # ~10-20 min instead of ~5-10. A ready-after-3/4 warning (below)
          # makes future drift visible before it turns red.
          MAX_WAIT=120
          WAIT_COUNT=0
          RESTARTS=0
          MAX_RESTARTS=3
          LAST_HTTP_CODE="000"
          # Track readiness explicitly: success on the final attempt leaves
          # WAIT_COUNT == MAX_WAIT, so the count alone can't tell success from
          # exhaustion (#3685).
          READY=false
          while [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; do
            WAIT_COUNT=$((WAIT_COUNT + 1))

            # Check if container has exited (crashed during startup)
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "missing")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ] || [ "$CONTAINER_STATUS" = "missing" ]; then
              RESTARTS=$((RESTARTS + 1))
              if [ "$RESTARTS" -le "$MAX_RESTARTS" ]; then
                echo "Container $CONTAINER has status '$CONTAINER_STATUS' — restarting (attempt $RESTARTS/$MAX_RESTARTS)..."
                docker compose up -d "${CFENGINE}"
                sleep 10
                continue
              else
                echo "::error::Container $CONTAINER failed to start after $MAX_RESTARTS restart attempts"
                docker logs "$CONTAINER" 2>&1 | tail -100
                exit 1
              fi
            fi

            # curl with -w "%{http_code}" always prints the code (000 if no
            # response). Don't add a `|| echo "000"` fallback — it would
            # concatenate with curl's own 000 output and produce "000000".
            LAST_HTTP_CODE=$(curl -s -o /dev/null --connect-timeout 2 --max-time 5 -w "%{http_code}" "http://localhost:${PORT}/" 2>/dev/null || true)
            LAST_HTTP_CODE=${LAST_HTTP_CODE:-000}
            if echo "$LAST_HTTP_CODE" | grep -qE "^(200|302|404)$"; then
              echo "CF engine is ready! (HTTP $LAST_HTTP_CODE on attempt $WAIT_COUNT/$MAX_WAIT)"
              if [ $((WAIT_COUNT * 4)) -gt $((MAX_WAIT * 3)) ]; then
                echo "::warning::${CFENGINE} became ready at attempt $WAIT_COUNT/$MAX_WAIT (past 3/4 of the ceiling); readiness headroom is shrinking."
              fi
              READY=true
              break
            fi

            # Surface partial progress every 10 attempts so logs show
            # whether we're stuck on "no response" or "5xx" early.
            if [ $((WAIT_COUNT % 10)) -eq 0 ]; then
              echo "  attempt $WAIT_COUNT/$MAX_WAIT: container=$CONTAINER_STATUS, http=$LAST_HTTP_CODE"
            fi

            if [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; then
              sleep 5
            fi
          done

          if [ "$READY" != "true" ]; then
            echo "::error::CF engine not ready after ${MAX_WAIT} attempts (last HTTP code: $LAST_HTTP_CODE)"
            if [ "$LAST_HTTP_CODE" = "000" ]; then
              echo "::notice::No HTTP response received — engine likely never bound to port $PORT."
            else
              echo "::notice::HTTP $LAST_HTTP_CODE received — engine bound to port $PORT but app is returning errors."
              echo "=== Final response body (first 500 bytes) ==="
              curl -s --max-time 5 "http://localhost:${PORT}/" 2>/dev/null | head -c 500 || true
              echo
              echo "=== /end response body ==="
            fi
            echo "=== Container logs (stack frames stripped, last 100 lines) ==="
            docker logs "$CONTAINER" 2>&1 | grep -vE '^\s*at\s|runwar\.context -[[:space:]]+at[[:space:]]' | tail -100
            echo "=== /end filtered logs ==="
            echo "=== Container logs (raw, last 200 lines) ==="
            docker logs "$CONTAINER" 2>&1 | tail -200
            echo "=== /end raw logs ==="
            exit 1
          fi

      - name: Patch Adobe CF serialfilter.txt for Oracle JDBC
        if: (matrix.cfengine == 'adobe2023' || matrix.cfengine == 'adobe2025') && matrix.database == 'oracle'
        run: |
          docker exec wheels-${{ matrix.cfengine }}-1 sh -c \
            "echo ';oracle.sql.converter.**;oracle.sql.**;oracle.jdbc.**' >> /wheels-test-suite/.engine/${{ matrix.cfengine }}/WEB-INF/cfusion/lib/serialfilter.txt"
          docker restart wheels-${{ matrix.cfengine }}-1

          # Wait for engine to come back up after restart. This used to fall
          # through silently when the engine never came back, so the suite ran
          # against a dead engine; fail loudly instead. A full Adobe restart has
          # the same cold-start profile as the readiness wait above, so it gets
          # the same ceiling (the old 30 was never measured: it could not fail).
          PORT_VAR="PORT_${{ matrix.cfengine }}"
          PORT="${!PORT_VAR}"
          CONTAINER="wheels-${{ matrix.cfengine }}-1"
          MAX_WAIT=120
          WAIT_COUNT=0
          READY=false
          while [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; do
            WAIT_COUNT=$((WAIT_COUNT + 1))
            if curl -s -o /dev/null --connect-timeout 2 --max-time 5 -w "%{http_code}" "http://localhost:${PORT}/" | grep -q "200\|404\|302"; then
              echo "CF engine back up after restart (attempt $WAIT_COUNT/$MAX_WAIT)"
              READY=true
              break
            fi
            if [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; then
              sleep 5
            fi
          done
          if [ "$READY" != "true" ]; then
            echo "::error::CF engine did not come back after the serialfilter restart (${MAX_WAIT} attempts)"
            echo "=== Container logs (raw, last 200 lines) ==="
            docker logs "$CONTAINER" 2>&1 | tail -200
            echo "=== /end raw logs ==="
            exit 1
          fi

      - name: Install CFPM packages (Adobe 2023/2025)
        if: matrix.cfengine == 'adobe2023' || matrix.cfengine == 'adobe2025'
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          PACKAGES="image,mail,zip,debugger,caching,mysql,postgresql,sqlserver,oracle"
          # Adobe 2025 raises "The graphqlclient package is not installed." while
          # loading an app's datasources at startup when this package is absent.
          if [ "${{ matrix.cfengine }}" = "adobe2025" ]; then
            PACKAGES="${PACKAGES},graphqlclient"
          fi

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES: Installing CFPM packages (${PACKAGES})..."

            if docker exec wheels-${{ matrix.cfengine }}-1 box cfpm install "${PACKAGES}"; then
              echo "CFPM packages installed successfully"
              exit 0
            else
              echo "CFPM installation failed on attempt $RETRY_COUNT"
              if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
                docker exec wheels-${{ matrix.cfengine }}-1 box server restart || true
                sleep 10
              fi
            fi
          done

          echo "Failed to install CFPM packages after $MAX_RETRIES attempts"
          exit 1

      - name: Wait for database to be ready
        run: |
          DB="${{ matrix.database }}"
          case "$DB" in
            mysql)
              echo "Waiting for MySQL..."
              timeout 60 bash -c 'until docker exec wheels-mysql-1 mysqladmin ping -h localhost -u root -pwheelstestdb --silent 2>/dev/null; do sleep 2; done'
              echo "MySQL is ready"
              ;;
            postgres)
              echo "Waiting for PostgreSQL..."
              timeout 60 bash -c 'until docker exec wheels-postgres-1 pg_isready -U wheelstestdb 2>/dev/null; do sleep 2; done'
              echo "PostgreSQL is ready"
              ;;
            sqlserver)
              echo "Waiting for SQL Server..."
              timeout 120 bash -c 'until docker exec wheels-sqlserver-1 /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "x!bsT8t60yo0cTVTPq" -Q "SELECT 1" -C 2>/dev/null | grep -q "1"; do sleep 5; done'
              echo "SQL Server is ready"
              ;;
            cockroachdb)
              echo "Waiting for CockroachDB..."
              timeout 60 bash -c 'until docker exec wheels-cockroachdb-1 cockroach sql --insecure -e "SELECT 1" 2>/dev/null; do sleep 2; done'
              echo "CockroachDB is ready"
              echo "Waiting for CockroachDB init to complete..."
              timeout 60 bash -c 'while [ "$(docker inspect --format="{{.State.Status}}" wheels-cockroachdb-init-1 2>/dev/null)" != "exited" ]; do sleep 2; done'
              echo "CockroachDB init complete"
              ;;
            oracle)
              # Checked probe (#3738): tools/ci/oracle-ready.sh runs a real
              # query against the wheelstestdb service and verifies the row.
              # The old inline probe never delivered its SQL (docker exec
              # without -i) and only warned on timeout, so a leg could start
              # against a service that could not run SQL.
              echo "Waiting for the Oracle wheelstestdb service to run SQL..."
              MAX_WAIT=60
              WAIT_COUNT=0
              ORACLE_READY=false
              while [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; do
                WAIT_COUNT=$((WAIT_COUNT + 1))
                if PROBE_ERR=$(bash tools/ci/oracle-ready.sh 2>&1); then
                  echo "Oracle is ready! (attempt ${WAIT_COUNT}/${MAX_WAIT})"
                  ORACLE_READY=true
                  break
                fi
                echo "Oracle not ready yet (attempt ${WAIT_COUNT}/${MAX_WAIT})"
                # Show the probe's own diagnostic every 6th attempt (~30s).
                if [ $((WAIT_COUNT % 6)) -eq 0 ]; then echo "$PROBE_ERR"; fi
                if [ "$WAIT_COUNT" -lt "$MAX_WAIT" ]; then sleep 5; fi
              done
              # Same final-attempt boundary as the CF readiness loop (#3685).
              if [ "$ORACLE_READY" != "true" ]; then
                echo "::error::Oracle could not run SQL after ${MAX_WAIT} attempts"
                echo "$PROBE_ERR"
                echo "=== Oracle container logs (last 60 lines) ==="
                docker logs wheels-oracle-1 2>&1 | tail -60
                exit 1
              fi
              ;;
            h2|sqlite)
              echo "$DB requires no external container"
              ;;
          esac

      - name: Wait for the engine to reach ${{ matrix.database }}
        # A database-side probe proves the database answers its own client,
        # not that the engine's JDBC datasource can connect (#3738: Oracle
        # passed its probe, then all three suite attempts failed with
        # ORA-12514 from the engine). Ask the engine itself, through the test
        # runner, before starting the suite.
        run: |
          PORT_VAR="PORT_${{ matrix.cfengine }}"
          # Warm-up: trigger Wheels onApplicationStart first. The engine
          # readiness check only verifies the web server responds.
          curl -s -o /dev/null --max-time 120 "http://localhost:${!PORT_VAR}/" || true
          bash tools/ci/wait-engine-db.sh "${!PORT_VAR}" "${{ matrix.database }}" 30 10

      - name: Run test suite for ${{ matrix.database }}
        id: run-tests
        run: |
          PORT_VAR="PORT_${{ matrix.cfengine }}"
          PORT="${!PORT_VAR}"
          BASE_URL="http://localhost:${PORT}/wheels/core/tests"
          DB="${{ matrix.database }}"

          # SOFT_FAIL_DBS and MIN_SPECS come from the workflow-level env.

          mkdir -p /tmp/test-results
          mkdir -p /tmp/junit-results

          # Warm-up: trigger Wheels onApplicationStart before first test run.
          # The engine readiness check only verifies the web server responds —
          # Wheels app initialization (datasource verification, model scanning)
          # happens on the first real request.
          echo "Warming up Wheels application before first test run..."
          curl -s -o /dev/null --max-time 60 "http://localhost:${PORT}/" || true
          sleep 2

          TEST_URL="${BASE_URL}?db=${DB}&format=json"

          RESULT_FILE="/tmp/test-results/${{ matrix.cfengine }}-${DB}-result.txt"
          JUNIT_FILE="/tmp/junit-results/${{ matrix.cfengine }}-${DB}-junit.xml"

          MAX_RETRIES=3
          RETRY_COUNT=0
          HTTP_CODE="000"

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Test attempt ${RETRY_COUNT} of ${MAX_RETRIES}..."

            HTTP_CODE=$(curl -s -o "$RESULT_FILE" \
              --max-time 900 \
              --write-out "%{http_code}" \
              "$TEST_URL" || echo "000")

            echo "HTTP Code: ${HTTP_CODE}"

            # Stop retrying on success (200) or test failures (417) —
            # 417 means tests ran to completion but some failed, which
            # is a definitive result. Only retry on transient errors.
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "417" ]; then
              break
            fi

            if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "Transient error (HTTP ${HTTP_CODE}), waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          # Convert JSON results to JUnit XML locally (avoids a second HTTP
          # request which would re-run the entire test suite — runner.cfm
          # does not cache results between requests)
          if [ -f "$RESULT_FILE" ]; then
            python3 tools/ci/testbox_junit.py "$RESULT_FILE" "$JUNIT_FILE" "${{ matrix.cfengine }}/${DB}" \
              || { echo "JUnit conversion failed for ${DB} (non-fatal)"; rm -f "$JUNIT_FILE"; }
          fi

          # Zero-test guard (#3302): MIN_SPECS (workflow env) is the floor.
          TOTAL_SPECS="-1"
          if [ -f "$RESULT_FILE" ] && { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "417" ]; }; then
            TOTAL_SPECS=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('$RESULT_FILE'))
            print(int(d.get('totalSpecs', 0)))
          except:
            print(-1)
          " 2>/dev/null || echo "-1")
          fi

          SPECS_OK=true
          if [ "$TOTAL_SPECS" -lt "$MIN_SPECS" ]; then
            SPECS_OK=false
          fi

          # Outcome. Only a COMPLETE run (HTTP 200/417 with at least MIN_SPECS
          # testcases) is evidence. A soft-fail database may report spec
          # failures (417) without failing the leg; an error envelope, a
          # missing result or a compile-wiped run fails the leg for every
          # database, soft-fail or not (#3738: a zero-test Oracle leg used to
          # read green).
          LEG="${{ matrix.cfengine }} + ${DB}"
          if [ "$HTTP_CODE" = "200" ] && [ "$SPECS_OK" = true ]; then
            echo "PASSED: ${LEG} (${TOTAL_SPECS} testcases)"
          elif [ "$HTTP_CODE" = "417" ] && [ "$SPECS_OK" = true ] && echo ",${SOFT_FAIL_DBS}," | grep -q ",${DB},"; then
            echo "FAILED: ${LEG} (spec failures in ${TOTAL_SPECS} testcases)"
            echo "::warning::${LEG}: spec failures, but ${DB} is in SOFT_FAIL_DBS (non-blocking)"
          else
            if [ "$HTTP_CODE" = "417" ] && [ "$SPECS_OK" = true ]; then
              echo "FAILED: ${LEG} (spec failures in ${TOTAL_SPECS} testcases)"
            elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "417" ]; then
              echo "::error::${LEG}: HTTP ${HTTP_CODE} but only ${TOTAL_SPECS} testcases reported (floor: ${MIN_SPECS}) — no valid result, treating leg as failed"
            else
              echo "::error::${LEG}: no valid result (HTTP ${HTTP_CODE} after ${RETRY_COUNT} attempts)"
              if [ -f "$RESULT_FILE" ]; then
                echo "=== Response body (first 1500 bytes) ==="
                head -c 1500 "$RESULT_FILE" || true
                echo
                echo "=== /end response body ==="
              fi
            fi
            exit 1
          fi

      - name: Report container exit state
        # A cgroup OOM-kill ends the JVM with exit 137 and NO Java error, so
        # a leg could otherwise fail (or pass on stale results) silently.
        if: always()
        env:
          CFENGINE: ${{ matrix.cfengine }}
          DB: ${{ matrix.database }}
        run: |
          # An OOM-killed or dead container invalidates the leg's result, so
          # this fails every leg, including a SOFT_FAIL_DBS one (#3738).
          BAD=0
          for C in "wheels-${CFENGINE}-1" "wheels-${DB}-1"; do
            STATE=$(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}} restarts={{.RestartCount}}' "$C" 2>/dev/null || echo "missing")
            # OOMKilled only reflects PID 1 (the CommandBox launcher); the server
            # JVM is its child, so a kernel kill of the JVM can leave the container
            # "running, oomkilled=false". The cgroup's oom_kill counter sees it.
            KILLS=$(docker exec "$C" sh -c 'cat /sys/fs/cgroup/memory.events 2>/dev/null || cat /sys/fs/cgroup/memory/memory.oom_control 2>/dev/null' 2>/dev/null | awk '$1=="oom_kill"{print $2}')
            STATE="$STATE cgroup_oom_kill=${KILLS:-n/a}"
            echo "$C: $STATE"
            echo "- \`$C\`: $STATE" >> "$GITHUB_STEP_SUMMARY"
            case "$STATE" in
              *oomkilled=true*|*cgroup_oom_kill=[1-9]*) echo "::error::$C had a process OOM-killed by the kernel (cgroup memory limit): $STATE"; BAD=1 ;;
              exited*|dead*) echo "::error::$C is not running after the suite: $STATE"; BAD=1 ;;
            esac
          done
          if [ "$BAD" = 1 ]; then
            exit 1
          fi

      - name: Generate per-leg summary
        if: always()
        run: |
          DB="${{ matrix.database }}"
          echo "### ${{ matrix.cfengine }} + ${DB} Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Database | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          # SOFT_FAIL_DBS and MIN_SPECS come from the workflow-level env.
          IS_SOFT_FAIL=false
          if echo ",${SOFT_FAIL_DBS}," | grep -q ",${DB},"; then
            IS_SOFT_FAIL=true
          fi

          RESULT_FILE="/tmp/test-results/${{ matrix.cfengine }}-${DB}-result.txt"
          if [ -f "$RESULT_FILE" ]; then
            # Check JSON for failures and testcase count (zero-test guard, #3302)
            STATS=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('$RESULT_FILE'))
            print(int(d.get('totalFail', 0) + d.get('totalError', 0)), int(d.get('totalSpecs', 0)))
          except:
            print(-1, -1)
          " 2>/dev/null || echo "-1 -1")
            FAIL_COUNT="${STATS% *}"
            SPEC_COUNT="${STATS#* }"

            # Soft-fail only ever softens counted spec failures from a
            # complete run; an invalid result is a failure for every DB (#3738).
            if [ "$FAIL_COUNT" = "-1" ]; then
              echo "| ${DB} | :x: No valid result (error envelope) |" >> $GITHUB_STEP_SUMMARY
            elif [ "$SPEC_COUNT" -lt "$MIN_SPECS" ]; then
              echo "| ${DB} | :x: ${SPEC_COUNT} tests (zero-test guard) |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$FAIL_COUNT" = "0" ]; then
              echo "| ${DB} | :white_check_mark: Pass (${SPEC_COUNT} tests) |" >> $GITHUB_STEP_SUMMARY
            elif [ "$IS_SOFT_FAIL" = true ]; then
              echo "| ${DB} | :warning: ${FAIL_COUNT} failures (soft-fail) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${DB} | :x: ${FAIL_COUNT} failures |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| ${DB} | :x: No result |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Debug information
        if: failure()
        run: |
          echo "=== Docker Container Status ==="
          docker ps -a

          echo -e "\n=== CF Engine Logs ==="
          docker logs $(docker ps -aq -f "name=${{ matrix.cfengine }}") 2>&1 | tail -100 || echo "Could not get logs"

          echo -e "\n=== Database Container Logs ==="
          docker logs $(docker ps -aq -f "name=${{ matrix.database }}") 2>&1 | tail -30 || echo "Could not get logs"

      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.cfengine }}-${{ matrix.database }}
          path: /tmp/test-results/

      - name: Upload JUnit XML artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ matrix.cfengine }}-${{ matrix.database }}
          path: /tmp/junit-results/

  #############################################
  # RustCFML (JVM-free engine)
  #############################################
  # Supported engine leg: the release-matrix counterpart of the required
  # PR check in .github/workflows/rustcfml-ci.yml (which runs the same
  # suite on every pull request to develop). The engine is pinned in
  # tools/rustcfml/ENGINE_VERSION (upstream ships multiple releases/day, so
  # tracking latest would make this lane flake on engine churn). Pass criteria
  # is "no NEW failures vs tools/rustcfml/baseline.json" — known residual
  # errors (open upstream issues, listed in the baseline notes) live in the
  # baseline. To bump the pin: update ENGINE_VERSION, run
  #   bash tools/rustcfml/run-suite.sh --write-baseline
  # on Linux, and commit both files together.
  rustcfml:
    name: "rustcfml"
    needs: plan
    # Full runs always include it; a narrowed dispatch only when `engines`
    # lists rustcfml.
    if: needs.plan.outputs.rustcfml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Read pinned engine version
        id: engine
        run: echo "version=$(tr -d '[:space:]' < tools/rustcfml/ENGINE_VERSION)" >> $GITHUB_OUTPUT

      - name: Cache engine binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/wheels-rustcfml
          key: rustcfml-${{ steps.engine.outputs.version }}-linux-x86_64

      - name: Run core suite against pinned RustCFML
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/rustcfml/run-suite.sh

  #############################################
  # Publish Test Results to PR
  #############################################
  publish-results:
    name: Publish Test Results
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download JUnit artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: junit-*
          path: junit-results/

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit-results/**/*.xml
          check_name: "Wheels Test Results"
          comment_title: "Wheels Test Results"
          # Keep the aggregate check neutral (#3302): oracle soft-fail debt
          # otherwise pins a red "Wheels Test Results" check to whatever SHA
          # the matrix was dispatched on, marking innocent PRs UNSTABLE.
          # Leg pass/fail gating lives in the tests job (OVERALL_STATUS);
          # annotations, PR comments, and artifacts are unaffected by this.
          fail_on: nothing
          report_individual_runs: true
          report_suite_logs: any
          json_file: junit-results/test-results.json
          json_suite_details: true
          json_test_case_results: true
          json_thousands_separator: ","

  #############################################
  # Test Matrix Summary Grid
  #############################################
  test-matrix-summary:
    name: Test Matrix Summary
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      grid: ${{ steps.matrix.outputs.grid }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download all test result artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: test-results-*
          path: results/

      - name: Generate matrix grid
        id: matrix
        run: |
          MATRIX_MD="## Wheels Test Matrix"
          MATRIX_MD="${MATRIX_MD}
          "
          MATRIX_MD="${MATRIX_MD}
          | Engine | MySQL | PostgreSQL | SQL Server | H2 | CockroachDB | Oracle | SQLite |"
          MATRIX_MD="${MATRIX_MD}
          |--------|:-----:|:----------:|:----------:|:--:|:-----------:|:------:|:------:|"

          # SOFT_FAIL_DBS and MIN_SPECS come from the workflow-level env.

          for engine in lucee6 lucee7 adobe2023 adobe2025 boxlang; do
            ROW="| **${engine}** |"
            for db in mysql postgres sqlserver h2 cockroachdb oracle sqlite; do
              FILE="results/test-results-${engine}-${db}/${engine}-${db}-result.txt"
              IS_SOFT_FAIL=false
              if echo ",${SOFT_FAIL_DBS}," | grep -q ",${db},"; then
                IS_SOFT_FAIL=true
              fi
              if [ -f "$FILE" ]; then
                STATS=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('$FILE'))
            print(int(d.get('totalFail', 0) + d.get('totalError', 0)), int(d.get('totalSpecs', 0)))
          except:
            print(-1, -1)
          " 2>/dev/null || echo "-1 -1")
                FAIL="${STATS% *}"
                SPECS="${STATS#* }"
                if [ "$FAIL" = "-1" ]; then
                  ROW="${ROW} :x: no result |"
                elif [ "$SPECS" -lt "$MIN_SPECS" ]; then
                  ROW="${ROW} :x: ${SPECS} tests |"
                elif [ "$FAIL" = "0" ]; then
                  ROW="${ROW} :white_check_mark: |"
                elif [ "$IS_SOFT_FAIL" = true ]; then
                  ROW="${ROW} :warning: ${FAIL} |"
                else
                  ROW="${ROW} :x: ${FAIL} |"
                fi
              else
                ROW="${ROW} -- |"
              fi
            done
            MATRIX_MD="${MATRIX_MD}
          ${ROW}"
          done

          SOFT_FAIL_NOTE=""
          if [ -n "$SOFT_FAIL_DBS" ]; then
            SOFT_FAIL_NOTE="*Soft-fail databases (${SOFT_FAIL_DBS}): :warning: N cells are spec failures that do not gate the run.*
          "
          fi
          MATRIX_MD="${MATRIX_MD}

          ${SOFT_FAIL_NOTE}*A ':x: N tests' cell means the leg reported fewer than ${MIN_SPECS} testcases (suite never ran; counted as failed). ':x: no result' means the leg returned no parseable result.*

          *Results for commit ${GITHUB_SHA:0:7}.*"

          # Write to step summary
          echo "$MATRIX_MD" >> $GITHUB_STEP_SUMMARY

          # Save for PR comment
          echo "$MATRIX_MD" > /tmp/matrix-comment.md

          # Expose for the notify-on-failure job
          {
            echo "grid<<MATRIX_GRID_EOF"
            echo "$MATRIX_MD"
            echo "MATRIX_GRID_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post matrix to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the triggering PR directly: a release branch can have more than
          # one open PR (e.g. into develop and main), so a --head lookup is ambiguous.
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.head_ref || github.ref_name }}" --json number --jq '.[0].number' 2>/dev/null)
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found, skipping comment"
            exit 0
          fi

          COMMENT_BODY=$(cat /tmp/matrix-comment.md)

          # Look for an existing matrix comment to update
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Wheels Test Matrix"))) | .id' \
            2>/dev/null | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              --method PATCH --field body="$COMMENT_BODY"
            echo "Updated existing comment ${COMMENT_ID}"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
            echo "Created new comment on PR #${PR_NUMBER}"
          fi

  #############################################
  # Notify on failure (scheduled runs)
  #############################################
  # A scheduled run has no PR to comment on, so a red nightly would otherwise go
  # unnoticed until someone opens the Actions tab. Keep ONE open tracking issue,
  # labelled `compat-matrix-failure`: open it (or comment on the open one) when a
  # nightly run fails, and close it with a comment when a nightly run is green again.
  # Every leg gates (SOFT_FAIL_DBS is empty), so a red Oracle leg trips this too.
  notify-on-failure:
    name: Notify on failure
    needs: [tests, rustcfml, test-matrix-summary]
    if: always() && (github.event_name == 'schedule' || inputs.notify == true)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTS_RESULT: ${{ needs.tests.result }}
          RUSTCFML_RESULT: ${{ needs.rustcfml.result }}
          GRID: ${{ needs.test-matrix-summary.outputs.grid }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="compat-matrix-failure"
          gh label create "$LABEL" --color B60205 \
            --description "Nightly compatibility matrix is failing" --force >/dev/null

          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # A narrowed dispatch can skip either job; skipped is not a failure.
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          if ok "$TESTS_RESULT" && ok "$RUSTCFML_RESULT"; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Compatibility matrix is green again on \`${SHORT_SHA}\` ([run](${RUN_URL})). Closing."
              gh issue close "$ISSUE" --reason completed
            fi
            echo "Matrix green; nothing to report."
            exit 0
          fi

          FAILED_JOBS=$(gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- `\(.name)` (\(.conclusion)): \(.html_url)"')

          BODY_FILE=$(mktemp)
          {
            echo "The compatibility matrix failed on \`${SHORT_SHA}\` (\`${GITHUB_REF_NAME}\`)."
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo "**Failed jobs**"
            echo ""
            if [ -n "$FAILED_JOBS" ]; then echo "$FAILED_JOBS"; else echo "- (tests: ${TESTS_RESULT}, rustcfml: ${RUSTCFML_RESULT})"; fi
            echo ""
            echo "$GRID"
          } > "$BODY_FILE"

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY_FILE"
            echo "Commented on tracking issue #${ISSUE}"
          else
            gh issue create --label "$LABEL" \
              --title "Compatibility matrix failing on ${GITHUB_REF_NAME}" \
              --body-file "$BODY_FILE"
          fi

  #############################################
  # Single aggregate gate (release PRs)
  #############################################
  # One stable check name to mark as required on the `main` ruleset, instead of
  # ~30 per-leg names. Every leg gates (SOFT_FAIL_DBS is empty, Oracle
  # included), so this passes only when the planner, every engine x database
  # leg, and RustCFML all succeeded.
  #
  # On pull_request (release PRs into main) the plan is always the full matrix
  # (dispatch inputs are blank), and both jobs must be `success`. A skipped job
  # there means legs did not run, so it fails. Only a narrowed workflow_dispatch
  # may legitimately skip `tests` or `rustcfml`; skipped is accepted there.
  matrix-gate:
    name: Compatibility Matrix Gate
    needs: [plan, tests, rustcfml]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every leg to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          RUSTCFML_RESULT: ${{ needs.rustcfml.result }}
        run: |
          echo "event: ${EVENT_NAME}; plan: ${PLAN_RESULT}, tests: ${TESTS_RESULT}, rustcfml: ${RUSTCFML_RESULT}"
          ok() {
            [ "$1" = "success" ] && return 0
            [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$1" = "skipped" ] && return 0
            return 1
          }
          if [ "$PLAN_RESULT" != "success" ] || ! ok "$TESTS_RESULT" || ! ok "$RUSTCFML_RESULT"; then
            echo "::error::Compatibility matrix is not green (plan: ${PLAN_RESULT}, tests: ${TESTS_RESULT}, rustcfml: ${RUSTCFML_RESULT})"
            exit 1
          fi
          echo "Compatibility matrix green."
