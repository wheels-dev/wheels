name: RustCFML

# JVM-free RustCFML engine leg on pull requests and develop pushes.
#
# Runs the core suite against the engine pinned in tools/rustcfml/ENGINE_VERSION
# and compares failures against tools/rustcfml/baseline.json: the leg fails only
# on NEW failures (or a totals regression), so upstream engine bugs tracked in
# the baseline do not block work. To bump the pin: update ENGINE_VERSION, run
#   bash tools/rustcfml/run-suite.sh --write-baseline
# on Linux, and commit both files together.

on:
  # No path filter on pull_request: the leg is a required branch-protection
  # check, and a path-gated required check would block merges whenever the
  # workflow skips. The pinned-engine suite is ~2 minutes, so running it on
  # every PR to develop is cheap.
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - "vendor/wheels/**"
      - "app/**"
      - "config/**"
      - "cli/**"
      - "tools/rustcfml/**"
      - ".github/workflows/rustcfml-ci.yml"

jobs:
  rustcfml:
    name: "RustCFML (Linux)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Engine-free: pins run-suite.sh's result parsing, keys and exit codes
      # (0 accepted / 3 rejected / 1 not evaluable) against fixtures (#3687).
      - name: Test the result comparison (no engine)
        run: python3 tools/rustcfml/test_run_suite.py

      # Engine-free: bump-pin.sh moves ENGINE_VERSION and the sha256 pins (and
      # the CLI's copies) together, and touches nothing when it can't (#3812).
      - name: Test the pin bump (no engine)
        run: python3 tools/rustcfml/test_bump_pin.py

      # Engine-free: run-suite.sh only uses an engine binary whose sha256 matches
      # the ENGINE_SHA256 pin (or a candidate release's published digest).
      - name: Test the engine download verification (no engine)
        run: python3 tools/rustcfml/test_resolve_engine.py

      # Engine-free: the daily version check skips a release listed in
      # tools/rustcfml/KNOWN_BAD, and every entry carries a tag, a link and a reason.
      - name: Test the known-bad release list (no engine)
        run: python3 tools/rustcfml/test_check_version.py

      - name: Read pinned engine version
        id: engine
        run: echo "version=$(tr -d '[:space:]' < tools/rustcfml/ENGINE_VERSION)" >> $GITHUB_OUTPUT

      - name: Cache engine binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/wheels-rustcfml
          key: rustcfml-${{ steps.engine.outputs.version }}-linux-x86_64

      - name: Run core suite against pinned RustCFML
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/rustcfml/run-suite.sh
