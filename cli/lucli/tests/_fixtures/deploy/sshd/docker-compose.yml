# Shared by every checkout on the machine (one Compose project, fixed ports). The
# public key is inline (test_key.pub) rather than bind-mounted, so the container
# config holds no path into the checkout that created it: a run from another
# checkout finds the same config, and a deleted worktree can't leave a dangling mount.
services:
  sshd1:
    image: ghcr.io/wheels-dev/mirror/linuxserver/openssh-server:latest
    environment:
      PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIED8dz5J/2zX6dKwp5Oqlp5wguhfg4lY0Pg91Z/tIa/h wheels-deploy-test"
      USER_NAME: deploy
      SUDO_ACCESS: "true"
      PASSWORD_ACCESS: "false"
    ports:
      - "22022:2222"

  sshd2:
    image: ghcr.io/wheels-dev/mirror/linuxserver/openssh-server:latest
    environment:
      PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIED8dz5J/2zX6dKwp5Oqlp5wguhfg4lY0Pg91Z/tIa/h wheels-deploy-test"
      USER_NAME: deploy
      SUDO_ACCESS: "true"
      PASSWORD_ACCESS: "false"
    ports:
      - "22023:2222"
